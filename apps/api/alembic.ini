# A generic, single database configuration for the Forge API.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# We store schema changes as plain SQL files under db/migrations/ rather
# than using `alembic revision --autogenerate`. The version table itself is
# managed by Alembic.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
