# Forge — single-host production stack (Phase 4, Issue #019).
#
# Deploy with `scripts/deploy.sh` (pull → migrate → up → smoke). Read
# `infra/DEPLOY_RUNBOOK.md` before the first deploy.
#
# Differences from docker-compose.yml (dev):
# - Images come from GHCR (built by .github/workflows/deploy.yml); no
#   local builds, no dev mounts, no reload.
# - Postgres is managed (DATABASE_URL points outside); no postgres service.
# - Caddy terminates TLS and routes: /api/* → api, / → web.
# - Prometheus scrapes api:8000/metrics; Grafana serves dashboards.
# - /metrics is reachable only inside the compose network (never via Caddy).

name: forge-prod

services:
  api:
    image: ${API_IMAGE:?API_IMAGE like ghcr.io/OWNER/forge-api:TAG is required}
    container_name: forge-prod-api
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?managed DATABASE_URL is required}
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ALLOW_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL like https://forge.example.com is required}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - frontend
      - backend

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?managed DATABASE_URL is required}
      ENVIRONMENT: production
    command: ["alembic", "upgrade", "head"]
    networks:
      - backend
    deploy:
      restart_policy:
        condition: none

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE like ghcr.io/OWNER/forge-worker:TAG is required}
    container_name: forge-prod-worker
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?managed DATABASE_URL is required}
      ENVIRONMENT: production
    networks:
      - backend
    # Sandbox containers run against the host daemon (see runbook).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE like ghcr.io/OWNER/forge-web:TAG is required}
    container_name: forge-prod-web
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      API_BASE_URL: http://api:8000
      WEB_PORT: "3000"
    expose:
      - "3000"
    depends_on:
      - api
    networks:
      - frontend

  caddy:
    image: caddy:2-alpine
    container_name: forge-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN like forge.example.com is required}
    depends_on:
      - api
      - web
    networks:
      - frontend

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: forge-prod-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    container_name: forge-prod-grafana
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - backend

networks:
  frontend:
    name: forge-prod-frontend
  backend:
    name: forge-prod-backend
    internal: true

volumes:
  caddy-data:
    name: forge-prod-caddy-data
  caddy-config:
    name: forge-prod-caddy-config
  prometheus-data:
    name: forge-prod-prometheus-data
  grafana-data:
    name: forge-prod-grafana-data
