version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - apps/api
      - workers/execution
      - packages/shared
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    # Scan the pnpm workspace from the root so dependency PRs also update
    # the root pnpm-lock.yaml. Scanning apps/web directly produces PRs
    # without lockfile changes, which fail CI under --frozen-lockfile.
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
