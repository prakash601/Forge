name: deploy-images

# Builds and pushes production images to GHCR. The host deploys them
# with scripts/deploy.sh (pull → migrate → up → smoke). Pushing is the
# CD gate: no image, no deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-images-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: worker
            dockerfile: infra/docker/worker.Dockerfile
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: sandbox
            dockerfile: infra/docker/sandbox.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/forge-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/forge-${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
