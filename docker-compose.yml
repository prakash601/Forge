# Forge — local stack (no domain, no TLS, no managed infra).
#
# One command on your laptop:
#   cp .env.example .env   # first time only
#   docker compose up --build
#
# This starts PostgreSQL + pgvector, runs migrations, then the API
# (:8000), worker, and web dashboard (:3000). Open:
#   Web: http://localhost:3000
#   API health: http://localhost:8000/health
#
# Local login needs no GitHub OAuth: use the "Continue locally" form
# on the dashboard (POST /api/v1/auth/dev-login, disabled in production).
#
# Networking note: inside Compose the web server reaches the API as
# `http://api:8000`, but your browser reaches it as
# `http://localhost:8000`. Both are set below; see apps/web/lib/urls.ts.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U forge -d forge"
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: forge-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://forge:forge@postgres:5432/forge
      ENVIRONMENT: development
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: forge-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://forge:forge@postgres:5432/forge
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
      interval: 10s
      timeout: 5s
      retries: 12
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: forge-worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://forge:forge@postgres:5432/forge
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    command: ["uv", "run", "python", "-m", "forge_worker"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: forge-web
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      WEB_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
    name: forge-postgres-data
