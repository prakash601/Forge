# Prometheus for the Forge single-host deployment (Phase 4, Issue #019).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: forge-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
